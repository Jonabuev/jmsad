worker_processes auto;

events {
    worker_connections 1024;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging
    ##
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$request_time"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    ##
    # Gzip
    ##
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml;
    gzip_vary on;

    ##
    # Rate Limiting
    ##
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    ##
    # Security Headers
    ##
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ##
    # SSL Settings
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ##
    # Upstreams
    ##
    # PRODUCTION
    upstream backend_prod {
        server jmsad_backend_prod:8000;
        keepalive 32;
    }
    upstream frontend_prod {
        server jmsad_frontend_prod:3000;
        keepalive 32;
    }

    # TEST
    upstream backend_test {
        server jmsad_backend_test:8000;
        keepalive 32;
    }
    upstream frontend_test {
        server jmsad_frontend_test:3000;
        keepalive 32;
    }

    ##
    # HTTP → HTTPS Redirect
    ##
    server {
        listen 80;
        server_name arno.kz www.arno.kz api.arno.kz dev.arno.kz api.dev.arno.kz;

        # ACME Challenge для Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    ##
    # PRODUCTION: arno.kz (Frontend)
    ##
    server {
        listen 443 ssl http2;
        server_name arno.kz www.arno.kz;

        # ✅ ОДИН сертификат для ВСЕХ доменов
        ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;

        location / {
            proxy_pass http://frontend_prod;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /media/ {
            alias /app/media/;
        }

        location /static/ {
            alias /app/staticfiles/;
        }
    }

    ##
    # PRODUCTION: api.arno.kz (Backend)
    ##
    server {
        listen 443 ssl http2;
        server_name api.arno.kz;

        ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;

        location / {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend_prod;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        location /media/ {
            alias /app/media/;
        }

        location /static/ {
            alias /app/staticfiles/;
        }
    }

    ##
    # TEST: dev.arno.kz (Frontend) с Basic Auth
    ##
    server {
        listen 443 ssl http2;
        server_name dev.arno.kz;

        ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;

        # 🔐 Basic Auth
        auth_basic "Development Environment";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://frontend_test;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /media/ {
            alias /app/media_test/;
        }

        location /static/ {
            alias /app/staticfiles_test/;
        }
    }

    ##
    # TEST: api.dev.arno.kz (Backend) с Basic Auth
    ##
    server {
        listen 443 ssl http2;
        server_name api.dev.arno.kz;

        ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;

        # Basic Auth
        auth_basic "Development API";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://backend_test;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # ПРОПУСКАЕМ CORS-ЗАГОЛОВКИ ОТ DJANGO
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
            proxy_pass_header Access-Control-Allow-Credentials;
            proxy_pass_header Access-Control-Expose-Headers;
        }

        location /media/ {
            alias /app/media_test/;
        }

        location /static/ {
            alias /app/staticfiles_test/;
        }
    }
}