services:
  # База данных (Test)
  postgres:
    image: postgres:16.9-alpine
    container_name: jmsad_postgres_test
    environment:
      POSTGRES_DB: jmsad_db_test
      POSTGRES_USER: jmsad_user_test
      POSTGRES_PASSWORD: jmsad_password_test
    ports:
      - "5433:5432" # отличается от продакшена
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - jmsad-network-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmsad_user_test -d jmsad_db_test"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Бэкенд Django (Test)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jmsad_backend_test
    ports:
      - "8001:8000" # отличается от продакшена
    env_file:
      - env.test
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_static_test:/app/staticfiles
      - backend_media_test:/app/media
    restart: unless-stopped
    networks:
      - jmsad-network-test
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Фронтенд Next.js (Test)
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: jmsad_frontend_test
    ports:
      - "3001:3000" # отличается от продакшена
    env_file:
      - front/.env.test
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jmsad-network-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_test:
  backend_static_test:
  backend_media_test:

networks:
  jmsad-network-test:
    driver: bridge
