services:
  # База данных
  postgres:
    image: postgres:16.9-alpine
    container_name: jmsad_postgres_vps
    environment:
      POSTGRES_DB: jmsad_db
      POSTGRES_USER: jmsad_user
      POSTGRES_PASSWORD: jmsad_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmsad_user -d jmsad_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Бэкенд Django
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: jmsad_backend_vps
    ports:
      - "8000:8000"
    env_file:
      - env.vps
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Фронтенд Next.js
  frontend:
    build: 
      context: ./front
      dockerfile: Dockerfile
    container_name: jmsad_frontend_vps
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx для проксирования (опционально)
volumes:
  postgres_data:
  backend_static:
  backend_media:

networks:
  jmsad-network:
    driver: bridge
