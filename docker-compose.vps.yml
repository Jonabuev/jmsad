version: '3.8'

services:
  postgres:
    image: postgres:16.9-alpine
    container_name: jmsad_postgres_dev
    environment:
      POSTGRES_DB: jmsad_db
      POSTGRES_USER: jmsad_user
      POSTGRES_PASSWORD: jmsad_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmsad_user -d jmsad_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jmsad_backend_dev
    ports:
      - "8000:8000"
    env_file:
      - .env.test
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
      - DB_NAME=jmsad_db
      - DB_USER=jmsad_user
      - DB_PASSWORD=jmsad_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - ALLOWED_HOSTS=dev.arno.kz,localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: jmsad_frontend_dev
    ports:
      - "3000:3000"
    env_file:
      - front/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://dev.arno.kz/api
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  backend_static:
  backend_media:

networks:
  jmsad-network:
    driver: bridge
