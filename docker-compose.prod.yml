services:
  # База данных
  postgres:
    image: postgres:16.9-alpine
    container_name: jmsad_postgres_prod
    environment:
      POSTGRES_DB: jmsad_db
      POSTGRES_USER: jmsad_user
      POSTGRES_PASSWORD: jmsad_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmsad_user -d jmsad_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Бэкенд
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: jmsad_backend_prod
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - DB_NAME=jmsad_db
      - DB_USER=jmsad_user
      - DB_PASSWORD=jmsad_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Фронтенд
  frontend:
    build: 
      context: ./front
      dockerfile: Dockerfile
    container_name: jmsad_frontend_prod
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  backend_static:
  backend_media:

networks:
  jmsad-network:
    driver: bridge
