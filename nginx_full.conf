worker_processes auto;

events {
    worker_connections 1024;
}

http {
    ##
    # CORS Origin Mapping для медиа файлов
    ##
    map $http_origin $cors_origin {
        default "";
        "https://arno.kz" "https://arno.kz";
        "https://www.arno.kz" "https://www.arno.kz";
        "https://dev.arno.kz" "https://dev.arno.kz";
    }
    
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    ##
    # MIME
    ##
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    ##
    # Logging
    ##
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$request_time"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    ##
    # Gzip
    ##
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml;
    gzip_vary on;

    ##
    # Rate Limiting (anti-DDoS)
    ##
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    ##
    # Security Headers
    ##
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ##
    # SSL Settings
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    ##
    # Upstream Blocks
    ##
    upstream django_backend {
        server jmsad_backend_prod:8000;
        keepalive 32;
    }
    upstream frontend {
    server frontend:3000; # имя сервиса из docker-compose
    }

    upstream backend {
        server backend:8000; # имя сервиса из docker-compose
    }

    ##
    # API Rate Limit Zone
    ##
    map $request_uri $is_api {
        default 0;
        ~^/api/ 1;
    }

    ##
    # Server Blocks
    ##
    server {
        listen 80;
        server_name arno.kz api.arno.kz dev.arno.kz api.dev.arno.kz;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name arno.kz;

        ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (если Next.js его использует)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        location /media/ {
            alias /app/media/;
            
            # ✅ CORS заголовки для медиа файлов (PDF, изображения и т.д.)
            # Используем map для динамического определения origin
            set $cors_header $cors_origin;
            if ($cors_header = "") {
                set $cors_header "https://arno.kz";  # Default для production
            }
            
            add_header Access-Control-Allow-Origin $cors_header always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Type" always;
            
            # Обработка preflight запросов
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_header always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location /static/ {
            alias /app/staticfiles/;
        }
    }

    server {
        listen 443 ssl;
        server_name api.arno.kz;
        ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;


        include /etc/nginx/snippets/acme.conf;

        location / {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_pass_request_headers on;

        }
        
        location /media/ {
            alias /app/media/;
            
            # ✅ CORS заголовки для медиа файлов (PDF, изображения и т.д.)
            # Используем map для динамического определения origin
            set $cors_header $cors_origin;
            if ($cors_header = "") {
                set $cors_header "https://arno.kz";  # Default для production
            }
            
            add_header Access-Control-Allow-Origin $cors_header always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Type" always;
            
            # Обработка preflight запросов
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_header always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
    }

    ##
    # TEST Upstreams
    ##
    upstream frontend_test { 
        server jmsad_frontend_test:3000; 
        }
    upstream django_backend_test { 
        server jmsad_backend_test:8000; 
        }


    ##
    # TEST servers
    ##
    server {
        listen 443 ssl;
        server_name dev.arno.kz;

        ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;

        auth_basic "Restricted Access (dev)";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://jmsad_frontend_test:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # TEST: Backend API
    server {
        listen 443 ssl;
        server_name api.dev.arno.kz;

        ssl_certificate /etc/letsencrypt/live/api.dev.arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.dev.arno.kz/privkey.pem;

        auth_basic "Restricted API Access (dev)";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            limit_req zone=api_limit burst=10 nodelay;
            
            proxy_pass http://jmsad_backend_test:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }
    }


    ##
    # ACME Challenge (SSL Renewal)
    ##
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
