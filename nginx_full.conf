# ========================================
# HTTP → HTTPS redirect (все домены)
# ========================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arno.kz www.arno.kz api.arno.kz dev.arno.kz api.dev.arno.kz;
    return 301 https://$host$request_uri;
}

# ========================================
# PROD: Frontend (arno.kz, www.arno.kz)
# ========================================
server {
    listen 443 ssl http2;
    server_name arno.kz www.arno.kz;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ========================================
# PROD: Backend (api.arno.kz)
# ========================================
server {
    listen 443 ssl http2;
    server_name api.arno.kz;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

