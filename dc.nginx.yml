version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: jmsad_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./fin_nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      # Статика через bind mounts
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - ./staticfiles_test:/app/staticfiles_test:ro
      - ./media_test:/app/media_test:ro
      # SSL
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Логи
      - ./nginx/logs:/var/log/nginx
    networks:
      - jmsad-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: jmsad_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - jmsad-network

networks:
  jmsad-network:
    external: true
