version: "3.8"

services:
  # Единый Nginx для всех доменов
  nginx:
    image: nginx:latest
    container_name: jmsad_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./fin_nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      # Статика PROD
      - backend_static:/app/staticfiles:ro
      - backend_media:/app/media:ro
      # Статика TEST
      - backend_static_test:/app/staticfiles_test:ro
      - backend_media_test:/app/media_test:ro
      # SSL
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Логи
      - ./nginx/logs:/var/log/nginx
    networks:
      - jmsad-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot для SSL
  certbot:
    image: certbot/certbot
    container_name: jmsad_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - jmsad-network

volumes:
  backend_static:
    external: true
    name: test_backend_static
  backend_media:
    external: true
    name: test_backend_media
  backend_static_test:
    external: true
    name: test_backend_static_test
  backend_media_test:
    external: true
    name: test_backend_media_test

networks:
  jmsad-network:
    external: true
