# Production Docker Compose с полной безопасностью
# ===================================================

version: "3.8"

services:
  # Redis для кеширования и rate limiting
  redis:
    image: redis:7-alpine
    container_name: jmsad_redis_prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379" # Только локальный доступ
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # База данных PostgreSQL
  postgres:
    image: postgres:16.9-alpine
    container_name: jmsad_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5432:5432" # Только локальный доступ
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backups:/backups # Для резервных копий
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  # Бэкенд Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
    container_name: jmsad_backend_prod
    ports:
      - "127.0.0.1:8000:8000" # Только через nginx
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      # Security
      - SECURE_SSL_REDIRECT=True
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - ./backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  # Фронтенд Next.js
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: jmsad_frontend_prod
    ports:
      - "127.0.0.1:3000:3000" # Только через nginx
    env_file:
      - front/.env.production
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jmsad-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  nginx_prod:
    image: nginx:latest
    container_name: jmsad_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_full.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:rw
      - ./certbot/www:/var/www/certbot:rw
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    networks:
      - jmsad-network
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot для SSL сертификатов
  certbot:
    image: certbot/certbot
    container_name: jmsad_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - jmsad-network

  # Backup service
  backup:
    image: postgres:16.9-alpine
    container_name: jmsad_backup
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./backend/scripts:/scripts:ro
    depends_on:
      - postgres
    networks:
      - jmsad-network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do /scripts/backup_database.sh; sleep 86400 & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local
  backend_media:
    driver: local

networks:
  jmsad-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
# Запуск:
# docker-compose -f docker-compose.production.yml up -d
#
# Первоначальная настройка SSL:
# docker-compose -f docker-compose.production.yml run --rm certbot \
#   certonly --webroot -w /var/www/certbot \
#   -d arno.kz -d www.arno.kz -d api.arno.kz \
#   --email admin@arno.kz --agree-tos --no-eff-email
#
# Мониторинг:
# docker-compose -f docker-compose.production.yml ps
# docker-compose -f docker-compose.production.yml logs -f
#
# Backup:
# docker-compose -f docker-compose.production.yml exec postgres \
#   pg_dump -U jmsad_user jmsad_db > backups/backup_$(date +%Y%m%d).sql

