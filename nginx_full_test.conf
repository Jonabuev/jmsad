##
# TEST Upstreams
##
upstream django_backend_test {
    server jmsad_backend_test:8000;  # важно: имя = container_name из docker-compose
    keepalive 32;
}

upstream frontend_test {
    server jmsad_frontend_test:3000; # тоже container_name
    keepalive 32;
}

##
# TEST servers
##
server {
    listen 443 ssl;
    server_name dev.arno.kz;

    ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;

    location / {
        proxy_pass http://frontend_test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /media/ {
        alias /app/media/;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}

server {
    listen 443 ssl;
    server_name api.dev.arno.kz;

    ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;

    location / {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://django_backend_test;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }
}
