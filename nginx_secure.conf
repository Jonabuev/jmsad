# Безопасная конфигурация Nginx для JMSAD
# =========================================

# Оптимизация воркеров
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Базовые настройки
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Безопасность: скрываем версию Nginx
    server_tokens off;
    
    # Размеры буферов (защита от buffer overflow)
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 10m;
    large_client_header_buffers 2 1k;
    
    # Таймауты (защита от Slowloris)
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # Логирование
    log_format detailed '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '$request_time $upstream_response_time';
    
    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log warn;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Защита от DDoS
    limit_req_status 429;
    limit_conn_status 429;
    
    # Upstream серверы
    upstream backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream frontend {
        least_conn;
        server frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Перенаправление HTTP -> HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name arno.kz www.arno.kz api.arno.kz;
        
        # ACME challenge для Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Перенаправление на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # HTTPS - API Backend
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.arno.kz;
        
        # SSL сертификаты
        ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/arno.kz/chain.pem;
        
        # SSL конфигурация (современная и безопасная)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL оптимизация
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        
        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;
        
        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # CSP для API
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        
        # Rate limiting для API
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;
        
        # Логи
        access_log /var/log/nginx/api_access.log detailed;
        error_log /var/log/nginx/api_error.log;
        
        # API endpoints
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
        
        # Усиленный rate limiting для авторизации
        location ~ ^/api/(auth|register|token)/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_conn conn_limit 5;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Django admin (только с белого списка IP)
        location /admin/ {
            # Ограничение по IP (раскомментируйте и добавьте свои IP)
            # allow 123.123.123.123;
            # deny all;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Static files
        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
        
        # Media files (с защитой от hotlinking)
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
            
            # Защита от hotlinking
            valid_referers none blocked server_names *.arno.kz;
            if ($invalid_referer) {
                return 403;
            }
        }
        
        # Health check
        location /health/ {
            proxy_pass http://backend;
            access_log off;
        }
    }
    
    # HTTPS - Frontend
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name arno.kz www.arno.kz;
        
        # SSL сертификаты
        ssl_certificate /etc/letsencrypt/live/arno.kz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arno.kz/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/arno.kz/chain.pem;
        
        # SSL конфигурация (аналогично API)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # Security Headers для фронтенда
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # CSP для фронтенда (Next.js)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://api.arno.kz https://apis.google.com; frame-src https://accounts.google.com;" always;
        
        # Rate limiting
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;
        
        # Логи
        access_log /var/log/nginx/frontend_access.log detailed;
        error_log /var/log/nginx/frontend_error.log;
        
        # Next.js
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            
            # WebSocket support для hot reload
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Next.js static files
        location /_next/static/ {
            proxy_pass http://frontend;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }
        
        # Next.js public files
        location /public/ {
            proxy_pass http://frontend;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
    
    # Блокировка доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Блокировка доступа к backup файлам
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

